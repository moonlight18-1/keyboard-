name: Build ML Keyboard APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate ML Keyboard project files
        run: |
          python3 - << 'PYEOF'
          import base64, json, os, zlib
          b64 = """
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          """
          raw = zlib.decompress(base64.b64decode("".join(b64.split())))
          payload = json.loads(raw.decode("utf-8"))
          for path, content in payload["text"].items():
              parent = os.path.dirname(path)
              if parent:
                  os.makedirs(parent, exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
          for path, b64content in payload["binary"].items():
              parent = os.path.dirname(path)
              if parent:
                  os.makedirs(parent, exist_ok=True)
              with open(path, "wb") as f:
                  f.write(base64.b64decode(b64content))
          print(f"Generated {len(payload['text']) + len(payload['binary'])} files")
          PYEOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDK_ROOT="$ANDROID_HOME"
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT="/usr/local/lib/android/sdk"; fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          yes 2>/dev/null | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK output
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ML-Keyboard-v4.0.0.apk

      - name: Upload ML Keyboard APK
        uses: actions/upload-artifact@v4
        with:
          name: ML-Keyboard-APK
          path: dist/ML-Keyboard-v4.0.0.apk
          if-no-files-found: error
